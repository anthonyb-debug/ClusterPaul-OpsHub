 * AGS PERFORMANCE HUB — SHARED CORE (AGSCore) v1.0.0
 * Same code in Apps Script (Core.gs, authoritative) and in AGS_Performance_Hub.html.
 * Attendance and Quality are copied from the Attendance Hub and the QA Hub (read-only); KPI grades,
 * escalations, grievances and attrition are entered here. The server enforces every permission.
 * ===================================================================== */
var AGSCore = (function () {
  'use strict';
  var CORE_VERSION = '1.0.0';
  var APP_NAME = 'Performance Hub';
  // Admin: everything. QA: everything except settings and users. Team lead: their own team.
  var ROLES = { ADMIN: 'ADMIN', QA: 'QA', TL: 'TEAM_LEAD' };
  var ROLE_LABELS = { ADMIN: 'Admin', QA: 'QA', TEAM_LEAD: 'Team lead' };
  var ASSIGNABLE_ROLES = ['ADMIN', 'QA', 'TEAM_LEAD'];
  function normRole(r) { r = String(r || '').toUpperCase().replace(/\s+/g, '_'); return r === 'TL' ? 'TEAM_LEAD' : r === 'QA_ANALYST' ? 'QA' : r; }
  var SEVERITIES = ['Low', 'Medium', 'High', 'Critical'];

    return '<section class="card" style="max-width:720px">' + k('Campaigns', 'Campaigns covered', 'Names as in Schedules, separated by commas.') + k('WatchAttendance', 'Watch: attendance below (%)', 'Agents below this are listed under Agents to watch.', 'number') + k('WatchQuality', 'Watch: quality below (%)', '', 'number') + k('WatchKpi', 'Watch: total grade below (1–5)', '', 'number') + k('TrainingPassMark', 'Training: pass mark (%)', 'Teach Back and Mock Call averages both at or above this = meets the mark.', 'number') + k('SessionHours', 'Session length (hours)', 'How long people stay signed in.', 'number') + healthFields() + k('ReportYear', 'Year for report dates without one', 'For dates like "Nov12". Leave empty for the current year.') + targetFields() +
      '<button class="btn btn-primary" data-act="saveSettings">Save settings</button></section>' +
      '<section class="card" style="max-width:720px"><h2>Links</h2>' + (ls && ls.at ? '<p>Last copied ' + esc(ago(ls.at)) + '.</p><ul class="small"><li>Roster: ' + esc(JSON.stringify(ls.roster && ls.roster.agents || {})) + '</li><li>Attendance weeks: ' + esc(JSON.stringify(ls.attendance || {})) + '</li><li>Quality weeks: ' + esc(JSON.stringify(ls.quality || {})) + '</li></ul>' + (ls.problems && ls.problems.length ? '<div class="note bad">' + ls.problems.map(esc).join('<br>') + '</div>' : '') : '<p class="muted">Not run yet. In Apps Script, run AGS_syncLinks, then AGS_installLinksTrigger.</p>') + '</section>'; };
  function targetFields() { var t = C.json(S.data.settings.ReportTargets, {}) || {}, f = function (src, k, lab, hint) { var v = (t[src] || {})[k]; return '<label class="tf">' + lab + ' <input class="input rt" data-src="' + src + '" data-k="' + k + '" value="' + esc(v === undefined ? '' : v) + '"><span class="muted small">' + hint + '</span></label>'; };
    return '<div class="field"><label class="lbl">Report targets (empty = no colour)</label><div class="tgrid"><b>Legacy</b>' + f('LEGACY_CALLS', 'aht', 'AHT at most', 'seconds') + f('LEGACY_CALLS', 'answerRate', 'Answer rate at least', '%') + f('LEGACY_CALLS', 'holdPct', 'Hold at most', '%') + f('LEGACY_CALLS', 'util', 'Utilisation at least', '%') +
      '<b>Banyan</b>' + f('BANYAN_CALLS', 'aht', 'AHT at most', 'seconds') + f('BANYAN_CALLS', 'prodPerDay', 'Productivity per day at least', '') + f('BANYAN_CALLS', 'holdPct', 'Hold at most', '%') + f('BANYAN_CALLS', 'util', 'Utilisation at least', '%') + '</div><div class="err" data-err="ReportTargets"></div></div>'; }
  function healthFields() { var h = C.json(S.data.settings.Health, null) || C.DEFAULT_HEALTH, row = function (k, lab, unit, rev) { return '<div class="hrow"><span>' + lab + '</span><label>' + (rev ? 'Green up to' : 'Green from') + ' <input class="input hh" data-h="' + k + '" data-i="0" value="' + esc(h[k][0]) + '">' + unit + '</label><label>' + (rev ? 'Amber up to' : 'Amber from') + ' <input class="input hh" data-h="' + k + '" data-i="1" value="' + esc(h[k][1]) + '">' + unit + '</label></div>'; };
    return '<div class="field"><label class="lbl">Campaign health (the worst measure decides; open Critical escalation or 2+ High = Red, 1 High = Amber)</label>' + row('attendance', 'Attendance', '%') + row('quality', 'Quality', '%') + row('kpi', 'KPI score', '') + row('watchShare', 'Agents to watch', '% of the team', true) + '<div class="err" data-err="Health"></div></div>'; }
  ACT.saveSettings = function (el) { var ch = {}; var h = C.json(S.data.settings.Health, null) || C.clone(C.DEFAULT_HEALTH), hc = false; $$('.hh').forEach(function (x) { var v = +x.value; if (v !== +h[x.dataset.h][+x.dataset.i]) { h[x.dataset.h][+x.dataset.i] = v; hc = true; } }); if (hc) ch.Health = JSON.stringify(h); var rt = C.json(S.data.settings.ReportTargets, {}) || {}, rc = false; $$('.rt').forEach(function (x) { rt[x.dataset.src] = rt[x.dataset.src] || {}; var v = x.value.trim() === '' ? '' : +x.value; if (String(rt[x.dataset.src][x.dataset.k] === undefined ? '' : rt[x.dataset.src][x.dataset.k]) !== String(v)) { rt[x.dataset.src][x.dataset.k] = v; rc = true; } }); if (rc) ch.ReportTargets = JSON.stringify(rt); $$('[data-st]').forEach(function (x) { if (x.value.trim() !== String(S.data.settings[x.dataset.st])) ch[x.dataset.st] = x.value; }); if (!Object.keys(ch).length) { toast('No changes to save.'); return; } el.disabled = true;
    write('saveSettings', { changes: ch }).then(function () { render(); toast('Settings saved.', 'ok'); }, function (e) { el.disabled = false; showErrors($('#page'), e); }); };
  SET.names = function () {
    var ls = C.json(S.data.settings.LinksSync, null), un = (ls && ls.unmatched) || {}, have = {}; S.data.aliases.forEach(function (x) { if (C.live(x)) have[x.Source + '|' + String(x.Key).toLowerCase()] = x; });
    var rows = []; Object.keys(un).forEach(function (src) { Object.keys(un[src] || {}).forEach(function (k) { rows.push({ src: src, key: k, label: un[src][k] }); }); });
    S.data.aliases.forEach(function (x) { if (C.live(x) && !rows.some(function (r) { return r.src === x.Source && r.key.toLowerCase() === String(x.Key).toLowerCase(); })) rows.push({ src: x.Source, key: x.Key, label: x.Label || x.Key }); });
    var opts = function (sel) { return '<option value="">Not matched</option>' + S.data.agents.filter(C.live).sort(function (a, b) { return a.FullName < b.FullName ? -1 : 1; }).map(function (a) { return '<option value="' + esc(a.AgentID) + '"' + (sel === a.AgentID ? ' selected' : '') + '>' + esc(a.FullName + ' · ' + a.Campaign) + '</option>'; }).join(''); };
    return '<div class="note">Names in the linked reports that did not match the roster automatically. Pick the agent once: it is remembered, and the next copy (within 30 minutes) includes their figures.</div>' +
      (rows.length ? '<section class="card flush"><div class="tw"><table class="t"><tr><th>Report</th><th>Name in the report</th><th>ID in the report</th><th>Agent</th></tr>' + rows.map(function (r) { var cur = have[r.src + '|' + r.key.toLowerCase()];
        return '<tr><td>' + esc(C.REPORT_SOURCES[r.src] || r.src) + '</td><td><b>' + esc(r.label) + '</b></td><td class="mono small">' + esc(r.key !== r.label ? r.key : '') + '</td><td><select class="input alias" data-src="' + esc(r.src) + '" data-key="' + esc(r.key) + '" data-label="' + esc(r.label) + '">' + opts(cur ? cur.AgentID : '') + '</select></td></tr>'; }).join('') + '</table></div></section>' : empty('Every name in the linked reports matches the roster.'));
  };
  document.addEventListener('change', function (e) { var el = e.target; if (!el.classList || !el.classList.contains('alias')) return;
    write('saveAlias', { source: el.dataset.src, key: el.dataset.key, label: el.dataset.label, agentId: el.value }).then(function () { toast(el.value ? 'Matched. Their figures appear after the next copy.' : 'Match removed.', 'ok'); }, function (e2) { toast(errText(e2), 'bad'); }); });
  SET.roster = function () { return '<div class="note">The roster is copied from <b>Schedules</b> for the campaigns covered. Add or change people there.</div><section class="card flush"><div class="tw"><table class="t"><tr><th>Agent</th><th>Employee ID</th><th>Campaign</th><th>Team lead</th><th>Status</th></tr>' +
    S.data.agents.slice().sort(function (a, b) { return a.FullName < b.FullName ? -1 : 1; }).map(function (a) { return '<tr><td>' + esc(a.FullName) + '</td><td>' + esc(a.EmployeeID) + '</td><td>' + esc(a.Campaign) + '</td><td>' + esc(tlName2(a.TeamLeadID)) + '</td><td>' + esc(a.Status) + '</td></tr>'; }).join('') + '</table></div></section>'; };
  SET.audit = function () { return '<div class="bar"><span class="muted">Every change: who, what and when.</span><span class="spacer"></span><button class="btn btn-primary" data-act="loadAudit">Load latest entries</button></div><section class="card flush" id="audit-box">' + empty('Not loaded yet.') + '</section>'; };
  ACT.loadAudit = function () { $('#audit-box').innerHTML = '<div class="loading">Loading…</div>'; api('getAuditLog', { limit: 300 }).then(function (r) { $('#audit-box').innerHTML = '<div class="tw"><table class="t"><tr><th>Time</th><th>Who</th><th>Action</th><th>Record</th><th>Fields</th></tr>' + r.rows.map(function (h) { return '<tr><td class="small">' + esc(new Date(h.Timestamp).toLocaleString()) + '</td><td>' + esc(h.ActorEmail) + '</td><td>' + esc(h.Action) + '</td><td>' + esc(h.EntityType + ' ' + h.EntityID) + '</td><td class="small">' + esc(h.ChangedFields) + '</td></tr>'; }).join('') + '</table></div>'; }, function (e) { $('#audit-box').innerHTML = '<div class="note bad">' + esc(e.message) + '</div>'; }); };
  // ---------------- boot
  setInterval(function () { if (S.user && !stack.length && document.visibilityState === 'visible' && S.page.split('/')[0] !== 'kpis') api('bootstrap', {}).then(function (d) { S.data = d; render(); }, function () { }); }, 5 * 60000);
  window.addEventListener('error', function (e) { if (S.user) toast('Unexpected error: ' + e.message, 'bad'); });
  function boot() { if (CFG.API_URL && CFG.GOOGLE_CLIENT_ID && getSession()) { start('http'); return; } renderLogin(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
