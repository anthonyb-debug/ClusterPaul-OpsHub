<script>
/* =====================================================================
 * AGS PERFORMANCE HUB — SHARED CORE (AGSCore) v1.0.0
 * Same code in Apps Script (Core.gs, authoritative) and in AGS_Performance_Hub.html.
 * Attendance and Quality are copied from the Attendance Hub and the QA Hub (read-only); KPI grades,
 * escalations, grievances and attrition are entered here. The server enforces every permission.
 * ===================================================================== */
var AGSCore = (function () {
  'use strict';
  var CORE_VERSION = '1.0.0';
  var APP_NAME = 'Performance Hub';
  // Admin: everything. QA: everything except settings and users. Team lead: their own team.
  var ROLES = { ADMIN: 'ADMIN', QA: 'QA', TL: 'TEAM_LEAD' };
  var ROLE_LABELS = { ADMIN: 'Admin', QA: 'QA', TEAM_LEAD: 'Team lead' };
  var ASSIGNABLE_ROLES = ['ADMIN', 'QA', 'TEAM_LEAD'];
  function normRole(r) { r = String(r || '').toUpperCase().replace(/\s+/g, '_'); return r === 'TL' ? 'TEAM_LEAD' : r === 'QA_ANALYST' ? 'QA' : r; }
  var SEVERITIES = ['Low', 'Medium', 'High', 'Critical'];
  var ESC_STATUSES = ['Open', 'In progress', 'Resolved'];
  var GRV_STATUSES = ['Open', 'Under review', 'Resolved', 'Closed'];
  var GRV_CATEGORIES = ['Schedule', 'Pay / benefits', 'Workload', 'Team lead / supervision', 'Co-worker', 'Facilities / equipment', 'Policy', 'Other'];
  var ATTRITION_TYPES = ['Resignation', 'Termination', 'End of contract', 'AWOL', 'Other'];
  var ACTIVE_STATUSES = ['Active', 'Inactive'];
  var META = ['IsSynthetic', 'CreatedAt', 'CreatedBy', 'UpdatedAt', 'UpdatedBy', 'RecordVersion', 'ArchivedAt', 'ArchivedBy'];
  var SCHEMA = {
    TeamLeads: ['TeamLeadID', 'FullName', 'Email', 'Campaigns', 'Status'].concat(META),
    Agents: ['AgentID', 'EmployeeID', 'FullName', 'Campaign', 'TeamLeadID', 'Email', 'Status', 'HireDate'].concat(META),
    KpiGrades: ['GradeID', 'AgentID', 'TeamLeadID', 'Campaign', 'Period', 'Grades', 'Score', 'Note'].concat(META),
    AttWeeks: ['WeekID', 'AgentID', 'Period', 'Scheduled', 'Lost', 'Pct', 'Days'].concat(META),
    QaWeeks: ['WeekID', 'AgentID', 'Period', 'Audits', 'Avg', 'Ztp'].concat(META),
    Escalations: ['EscalationID', 'Date', 'Campaign', 'AgentID', 'Client', 'Severity', 'Summary', 'Status', 'Owner', 'ResolvedDate', 'Resolution'].concat(META),
    Grievances: ['GrievanceID', 'Date', 'Campaign', 'AgentID', 'Category', 'Details', 'Status', 'HandledBy', 'ResolvedDate', 'Resolution'].concat(META),
    Attrition: ['AttritionID', 'AgentID', 'Campaign', 'TeamLeadID', 'LastDay', 'Type', 'Reason', 'RehireEligible', 'Notes'].concat(META),
    CallWeeks: ['WeekID', 'Source', 'AgentID', 'Period', 'Days', 'Inbound', 'Outbound', 'TalkSec', 'HoldSec', 'HandleSec', 'LoginSec', 'Offered', 'Missed'].concat(META),
    AdmitMonths: ['RowID', 'AgentID', 'Month', 'Calls', 'CallsVob', 'Admits'].concat(META),
    Aliases: ['AliasID', 'Source', 'Key', 'Label', 'AgentID'].concat(META),
    TrainingScores: ['RowID', 'TraineeKey', 'Name', 'EmployeeID', 'Campaign', 'HireDate', 'Card', 'Week', 'Score', 'Audits', 'LastDate', 'Trainer'].concat(META),
    TrainingDecisions: ['DecisionID', 'TraineeKey', 'Name', 'Campaign', 'Decision', 'DecidedOn', 'Notes'].concat(META),
    Users: ['UserID', 'Email', 'DisplayName', 'Role', 'TeamLeadID', 'Active'].concat(META),
    AuditLog: ['AuditID', 'Timestamp', 'ActorEmail', 'ActorRole', 'Action', 'EntityType', 'EntityID', 'RequestID', 'ChangedFields', 'Details'],
    SyncLog: ['SyncID', 'Timestamp', 'ActorEmail', 'Action', 'RequestID', 'Status', 'DurationMs', 'EntityType', 'EntityID', 'Message'],
    AppSettings: ['Key', 'Value', 'Description', 'UpdatedAt', 'UpdatedBy']
  };
  var ENTITIES = {
    teamLeads: { sheet: 'TeamLeads', id: 'TeamLeadID', prefix: 'TL', yearly: false, label: 'Team lead' },
    agents: { sheet: 'Agents', id: 'AgentID', prefix: 'AG', yearly: false, label: 'Agent' },
    kpiGrades: { sheet: 'KpiGrades', id: 'GradeID', prefix: 'KG', yearly: true, label: 'KPI grades' },
    attWeeks: { sheet: 'AttWeeks', id: 'WeekID', prefix: 'AW', yearly: false, label: 'Attendance week' },
    qaWeeks: { sheet: 'QaWeeks', id: 'WeekID', prefix: 'QW', yearly: false, label: 'Quality week' },
    escalations: { sheet: 'Escalations', id: 'EscalationID', prefix: 'ES', yearly: true, label: 'Escalation' },
    grievances: { sheet: 'Grievances', id: 'GrievanceID', prefix: 'GR', yearly: true, label: 'Grievance' },
    attrition: { sheet: 'Attrition', id: 'AttritionID', prefix: 'AT', yearly: true, label: 'Attrition record' },
    callWeeks: { sheet: 'CallWeeks', id: 'WeekID', prefix: 'CW', yearly: false, label: 'Call report week' },
    admitMonths: { sheet: 'AdmitMonths', id: 'RowID', prefix: 'AM', yearly: false, label: 'Admits month' },
    aliases: { sheet: 'Aliases', id: 'AliasID', prefix: 'AL', yearly: false, label: 'Name match' },
    trainingScores: { sheet: 'TrainingScores', id: 'RowID', prefix: 'TS', yearly: false, label: 'Training score' },
    trainingDecisions: { sheet: 'TrainingDecisions', id: 'DecisionID', prefix: 'TD', yearly: false, label: 'Training decision' },
    users: { sheet: 'Users', id: 'UserID', prefix: 'USR', yearly: false, label: 'User' }
  };
  var DATA_ENTITIES = ['teamLeads', 'agents', 'kpiGrades', 'attWeeks', 'qaWeeks', 'escalations', 'grievances', 'attrition', 'callWeeks', 'admitMonths', 'aliases', 'trainingScores', 'trainingDecisions'];
  // Training: trainee scorecards from the QA Hub. The decision (endorse to production or training fallout) is recorded here.
  var DECISIONS = ['Pending', 'Endorsed to production', 'Training fallout (TFO)', 'Extended'];
  // Linked call reports: Legacy 2026 and Banyan 2026 ("Daily Call Report") and the Hercules dashboard ("AGENT VOB ADMITS MTD").
  var REPORT_SOURCES = { LEGACY_CALLS: 'Legacy daily call report', BANYAN_CALLS: 'Banyan daily call report', HERCULES: 'Hercules (admits and VOB)' };
  // Campaign health: the worst of these measures (green / amber / red).
  var DEFAULT_HEALTH = { attendance: [95, 90], quality: [87, 81], kpi: [3.5, 3], watchShare: [10, 20] };

  // as percentages from the hubs and are not graded. KPI score = Σ grade × weight ÷ Σ weight of the KPIs graded.
  var DEFAULT_KPIS = {
    Banyan: [{ key: 'aht', label: 'AHT', weight: 25 }, { key: 'prod', label: 'Productivity', weight: 25 }],
    Legacy: [{ key: 'transfer', label: 'Transfer rate', weight: 10, group: 'Calls (40%)' }, { key: 'vob', label: 'VOB rate', weight: 10, group: 'Calls (40%)' },
      { key: 'admission', label: 'Admission rate', weight: 10, group: 'Calls (40%)' }, { key: 'aht', label: 'AHT', weight: 10, group: 'Calls (40%)' },
      { key: 'chat_admits', label: 'Chat admits', weight: 5, group: 'Chat (10%)' }, { key: 'chat_vob', label: 'Chat VOB rate', weight: 5, group: 'Chat (10%)' }],
    Takahami: [{ key: 'prod', label: 'Productivity (claims per day)', weight: 50 }]
